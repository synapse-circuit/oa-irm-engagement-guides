<text x="40.0" y="134" font-size="11" font-weight="700" fill="#F46800">SHARED · EVERY PAGE STARTS HERE</text>
<text x="686.2857142857142" y="134" font-size="11" font-weight="700" fill="#8B5CF6">EXTERNAL INCIDENT TOOL</text>
<text x="48" y="378" font-size="12.5" fill="#9AA0AA">Acknowledge fast — it pauses escalation and signals you&#x27;re on it.  Phone keypress:  1 acknowledge · 2 resolve · 3 silence 30 min · 4 repeat.</text>
<text x="48" y="400" font-size="12.5" fill="#9AA0AA">Silencing is time-limited and keeps the group open. Always add a resolution note when you resolve.</text>
<text x="48" y="422" font-size="12.5" fill="#9AA0AA">ServiceNow syncs status both ways; with Jira or a plain webhook, confirm the IRM alert group is resolved so paging fully stops.</text>
